# Search Form Interaction Workflow
# Demonstrates click, type, and wait_for actions
#
# Uses httpbingo.org's pizza form — a stable sandbox with real inputs.
# DuckDuckGo's SPA no longer exposes reliable input[name='q'] / result
# data-testid selectors for automation demos.

name: search_form
description: Fill and submit a form on httpbingo.org
version: "1.0"

browser:
  headless: true

params:
  query:
    type: string
    required: true
    default: "browser automation"
    description: Value typed into the customer-name field

triggers:
  manual: true
  api:
    path: /search
    method: POST

steps:
  - id: navigate
    action: goto
    url: "https://httpbingo.org/forms/post"

  - id: wait_for_input
    action: wait_for
    selector: "input[name='custname']"
    timeout: 10000

  - id: type_query
    action: type
    selector: "input[name='custname']"
    text: "{{params.query}}"
    clear: true

  - id: type_comments
    action: type
    selector: "textarea[name='comments']"
    text: "Submitted via Automodus workflow"
    clear: true

  # Submit the form — httpbingo returns a JSON echo of the POST body
  - id: click_search
    action: click
    selector: "button[type='submit'], button"

  # After submit the page becomes a JSON document; wait for body text.
  # wait_for text tolerates transient CDP context loss during navigation.
  - id: wait_for_results
    action: wait_for
    text: "custname"
    timeout: 15000

  - id: wait_body
    action: wait_for
    selector: "body"
    timeout: 10000

  # Extract the echoed customer name from the JSON response
  - id: extract_first_result
    action: extract
    selector: "body"
    as: response_body

  - id: screenshot_results
    action: screenshot
    path: "data/screenshots/search_results.png"

  - id: log_done
    action: log
    message: "Form submitted for: {{params.query}}"

output:
  query: "{{params.query}}"
  first_result: "{{store.response_body}}"
  screenshot: "data/screenshots/search_results.png"

on_error:
  screenshot: true
  emit:
    event: search_failed
